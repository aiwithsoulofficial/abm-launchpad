header{padding:clamp(44px,7vw,92px) var(--pad) clamp(38px,5vw,64px);--o:.25;background:radial-gradient(90% 120% at 85% 0%,rgba(232,213,192,.75),transparent 62%),radial-gradient(70% 90% at 0% 100%,rgba(212,220,202,.5),transparent 60%),var(--l1)}

input::placeholder{color:var(--br3)}input:focus{outline:2px solid var(--rust);outline-offset:2px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:12px var(--pad);background:rgba(245,240,235,.93);backdrop-filter:blur(8px);border-block:1px solid var(--blush);scrollbar-width:none}
nav a{flex:none;font-size:14px;font-weight:600;color:var(--br2);text-decoration:none;padding:6px 13px;border-radius:99px;transition:background .15s,color .15s}
nav a:hover,nav a:focus-visible{background:var(--rust);color:#fff;outline:none}
section{padding:clamp(36px,5vw,60px) var(--pad);scroll-margin-top:58px}
section:nth-of-type(odd){background:radial-gradient(60% 90% at 100% 0%,rgba(232,213,192,.45),transparent 70%),var(--l2)}
section:nth-of-type(even){background:radial-gradient(60% 90% at 0% 100%,rgba(212,220,202,.32),transparent 70%),var(--l1)}

a.card:hover,a.card:focus-visible{transform:translateY(-3px);border-color:var(--rust2);box-shadow:0 20px 34px -20px rgba(168,85,61,.6);outline:none}
.mono{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--rust),var(--rust2) 50%,var(--rust3));color:#fff;font-weight:800;font-size:19px;box-shadow:0 6px 14px -7px rgba(168,85,61,.8);transition:transform .18s}
a.card:hover .mono,a.card:focus-visible .mono{transform:scale(1.06)}
.card>span:last-child{min-width:0}.name{display:block;font-weight:700;font-size:18px;line-height:1.25}.what{display:block;overflow-wrap:anywhere;margin-top:2px;font-size:15px;line-height:1.35;color:var(--br2)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.home{background:var(--sage2);color:#fff}.leaving{background:var(--blush);color:var(--br2)}.check{color:var(--rust3);box-shadow:inset 0 0 0 1px var(--rust2)}
.empty{display:none;padding:50px var(--pad);text-align:center;color:var(--br2)}
footer{padding:34px var(--pad) 40px;--o:.1;background:var(--l3);color:var(--br2);font-size:15px;display:flex;flex-wrap:wrap;gap:12px 30px;justify-content:space-between;align-items:center}
.by{display:inline-flex;align-items:center;gap:10px;font-weight:600;color:var(--br)}
